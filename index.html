<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini GTA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div id="game-ui">
            <div id="stats">
                <div id="health-bar">
                    <div id="health-label">HEALTH</div>
                    <div id="health-value"></div>
                </div>
                <div id="money">$<span id="money-value">0</span></div>
                <div id="wanted-level">
                    <span class="star">★</span>
                    <span class="star">★</span>
                    <span class="star">★</span>
                    <span class="star">★</span>
                    <span class="star">★</span>
                </div>
                <div id="ammo"><span id="ammo-value">0</span></div>
            </div>
            <div id="mission-info"></div>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div id="controls-info">
            <p>WASD or Arrows: Move</p>
            <p>E: Enter/Exit Vehicle</p>
            <p>Space: Shoot/Action</p>
            <p>M: Toggle Map</p>
            <p>R: Reload</p>
        </div>
    </div>
    <div id="game-menu">
        <h1>MINI GTA</h1>
        <button id="start-game">Start Game</button>
        <button id="controls">Controls</button>
        <div id="control-instructions" class="hidden">
            <h2>Controls</h2>
            <p>WASD or Arrow Keys: Move character</p>
            <p>E: Enter/Exit vehicle</p>
            <p>Space: Shoot/Action</p>
            <p>M: Toggle map</p>
            <p>R: Reload weapon</p>
            <button id="back-button">Back</button>
        </div>
    </div>
    <div id="game-over" class="hidden">
        <h2>WASTED</h2>
        <p>Your score: $<span id="final-score">0</span></p>
        <button id="restart-game">Try Again</button>
    </div>
    
    <!-- Scripts -->
    <script src="js/utils.js"></script>
    <script src="js/sprites.js"></script>
    <script src="js/assets.js"></script>
    <script src="js/map.js"></script>
    <script src="js/npc.js"></script>
    <script src="js/vehicles.js"></script>
    <script src="js/player.js"></script>
    <script src="js/police.js"></script>
    <script src="js/missions.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
